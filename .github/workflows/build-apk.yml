name: Build Anexartitos Android APK

on:
  push:
    branches: [main]
    paths:
      - 'source-archive/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original Android Studio project
        shell: bash
        run: |
          set -euo pipefail
          cat source-archive/part-*.txt | tr -d '\n\r ' | base64 -d | tar -xJf -
          test -f app/src/main/java/gr/anexartitos/admin/MainActivity.java
          test -f app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform using runner SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anexartitos-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 15
          if-no-files-found: error
